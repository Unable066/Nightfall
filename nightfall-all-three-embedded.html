function decodePage(encoded){const binary=atob(encoded);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new TextDecoder().decode(bytes)}
const frames=[...document.querySelectorAll('.view iframe')];
function showPage(index){document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===index));document.querySelectorAll('.view').forEach((v,i)=>v.classList.toggle('active',i===index));const frame=frames[index];if(!frame.dataset.loaded){frame.srcdoc=decodePage(embeddedPages[index].data);frame.dataset.loaded='1';}}
document.querySelectorAll('.tab').forEach((button)=>button.addEventListener('click',()=>showPage(Number(button.dataset.page))));
showPage(0);
</script></body></html>
